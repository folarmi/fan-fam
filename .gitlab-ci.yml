
stages:
  - build
  - build-static
  - deploy

variables:
  # DOCKER_HOST: tcp://docker:2375
  # DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_IMAGE_NAME: $(echo "fanfam-frontend-$CI_COMMIT_REF_NAME" | tr '.' '-')
  DOCKER_REGISTRY: registry.gitlab.com/biyartech1/fan-fam-apps/fanfam-frontend:$CI_COMMIT_REF_NAME
  DOCKER_REGISTRY_SERVER: "registry.gitlab.com"


cache:
  paths:
    - node_modules/


build_project:
  stage: build
  script:
    - echo "CI_COMMIT_REF_NAME - $CI_COMMIT_REF_NAME"
    - echo "DOCKER_REGISTRY in build stage:" $DOCKER_REGISTRY
    - echo "Installing dependencies..."
    - npm install
    - echo "Building the React app..."
    - npm run build
    - echo "Build completed. Listing files..."
    - ls -Force
    - echo "Logging into Docker registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $DOCKER_REGISTRY_SERVER
    - echo "Building Docker image..."
    - docker build -t $DOCKER_REGISTRY .
    - echo "Pushing Docker image..."
    - docker image
    - docker push "$DOCKER_REGISTRY"
    - echo "Docker image $DOCKER_REGISTRY built and pushed successfully."
  artifacts:
    paths:
      - .next/
    expire_in: 1 week

build_static-files:
  stage: build-static
  only:
    - dev
  script:
    - echo "Exporting Static files"
    - npm run export
    - ls -Force